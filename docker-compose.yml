services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emotherm
      POSTGRES_USER: emotherm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emotherm"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://emotherm:${POSTGRES_PASSWORD}@db:5432/emotherm
      DATA_DIR: /app/data
      MODEL_PATH: /app/ml/artifacts/model.pt
      METRICS_PATH: /app/ml/artifacts/metrics.json
      DATASET_PATH: /dataset
    volumes:
      - encrypted_data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
    # Linux camera access: add devices: ["/dev/video0:/dev/video0"]
    # Serial access: add devices: ["/dev/ttyUSB0:/dev/ttyUSB0"] and configure CAMERA_SERIAL_PORT.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  encrypted_data:
